id = "soulmanyes/dpideck"
name = "DPIdeck"
version = "1.2.0"
# 43 for the surface_container colour role, 24 for argv runAsync (setting values reach control.py without a
# shell), 9 for closure callbacks.
plugin_api = 43
author = "Soulmanyes"
license = "CC0-1.0"
icon = "mouse"
description = "Battery level of an ATK/VXE wireless mouse in the bar; click it to change the mouse's settings, through DPIdeck."
tags = ["hardware", "system", "panel"]
dependencies = ["python3"]

# Opened by clicking the bar widget. DPI stages and quick settings (polling
# rate, sensor mode, switches) always show. Lift-off, debounce, sleep and the
# DPI light show too, and can be hidden with the panel's own edit button (saved
# in the plugin's data folder, not here). Buttons and the receiver light stay
# in the app.
[[panel]]
id = "panel"
entry = "panel.luau"
width = 440
height = 720
placement = "attached"
open_near_click = true

# The same panel as a floating window. The bar widget's "Floating panel"
# setting (middle-click the widget) picks which of the two a click opens.
[[panel]]
id = "panel-floating"
entry = "panel.luau"
width = 440
height = 720
placement = "floating"

[[widget]]
id = "bar"
entry = "dpideck.luau"

  [[widget.setting]]
  key = "floating"
  type = "bool"
  label_key = "settings.floating.label"
  description_key = "settings.floating.description"
  default = false
