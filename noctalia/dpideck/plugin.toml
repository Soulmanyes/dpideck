id = "soulmanyes/dpideck"
name = "DPIdeck"
version = "1.1.0"
# 43 for the surface_container colour role, 24 for argv runAsync (setting values reach control.py without a
# shell), 9 for closure callbacks.
plugin_api = 43
author = "Soulmanyes"
license = "CC0-1.0"
icon = "mouse"
description = "Battery level of an ATK/VXE wireless mouse in the bar; click it to change the mouse's settings, through DPIdeck."
tags = ["hardware", "system", "panel"]
dependencies = ["python3"]

# Opened by clicking the bar widget. DPI stages and quick settings (polling
# rate, sensor mode, switches) always show; lift-off, debounce, sleep and the
# DPI light are off by default and turned on below. Buttons and the receiver
# light stay in the app.
[[panel]]
id = "panel"
entry = "panel.luau"
width = 440
height = 720
placement = "attached"
open_near_click = true

  [[panel.setting]]
  key = "show_lift_off"
  type = "bool"
  label_key = "settings.show_lift_off.label"
  description_key = "settings.show_lift_off.description"
  default = false

  [[panel.setting]]
  key = "show_debounce"
  type = "bool"
  label_key = "settings.show_debounce.label"
  description_key = "settings.show_debounce.description"
  default = false

  [[panel.setting]]
  key = "show_sleep"
  type = "bool"
  label_key = "settings.show_sleep.label"
  description_key = "settings.show_sleep.description"
  default = false

  [[panel.setting]]
  key = "show_lighting"
  type = "bool"
  label_key = "settings.show_lighting.label"
  description_key = "settings.show_lighting.description"
  default = false

[[widget]]
id = "bar"
entry = "dpideck.luau"
